# 源 #2（YouMind）效果图镜像。
#
# 为什么放在 CI 而不是本地：源图床 cms-assets.youmind.com 在维护者所在网络被
# DNS 层面封锁（解析到 Meta 地址段、TLS 出示 *.facebook.com 证书），本地直连
# 必然 rc=60；LightWAN 是隧道型加速器，不提供 HTTP 代理端口且未加速该域名。
# GitHub runner 不在该网络内，可**原字节直取**，不经任何第三方图片代理，
# 因此没有二次压缩。
#
# 下载逻辑复用 Logexus 仓库里那个已离线验证过的脚本，不在此重复实现：
#   products/tauri-app/scripts/make-ym-thumbs.py
#
# ⚠️ 本 workflow 只写 `ym/` 一个目录，**绝不触碰本仓库已有文件**
#    （README.md / images/ / thumbs/ / *.html）。提交步骤有硬守卫：
#    暂存区只要出现 `ym/` 之外的路径就中止，不提交、不推送。
#
# 模式：
#   verify —— 只下载 + 报告张数体积，完全不写盘（默认）
#   commit —— 下载后把 ym/images 与 ym/thumbs 提交进本仓库
name: YM mirror

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify=只报告不提交；commit=提交 ym/ 进本仓库"
        type: choice
        options: [verify, commit]
        default: verify

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 logexus-releases
        uses: actions/checkout@v4

      - name: 检出 Logexus（取清单 + 复用镜像脚本）
        uses: actions/checkout@v4
        with:
          repository: jakmax520/Logexus
          path: .logexus

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow

      - name: 下载 181 张原图 + 生成 480px WebP 缩略图
        run: python3 .logexus/products/tauri-app/scripts/make-ym-thumbs.py --out /tmp/mirror

      - name: 报告
        run: |
          IMG=$(find /tmp/mirror/ym/images -type f | wc -l | tr -d ' ')
          THM=$(find /tmp/mirror/ym/thumbs -type f | wc -l | tr -d ' ')
          {
            echo "### 源 #2 镜像结果"
            echo ""
            echo "| 目录 | 张数 | 体积 |"
            echo "|---|---|---|"
            echo "| ym/images | ${IMG} | $(du -sh /tmp/mirror/ym/images | cut -f1) |"
            echo "| ym/thumbs | ${THM} | $(du -sh /tmp/mirror/ym/thumbs | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "images 张数: ${IMG}"
          echo "thumbs 张数: ${THM}"
          du -sh /tmp/mirror/ym/images /tmp/mirror/ym/thumbs
          echo "--- 抽样 3 张原图 ---"
          find /tmp/mirror/ym/images -type f | sort | head -3 | xargs ls -l
          echo "--- 抽样 3 张缩略图 ---"
          find /tmp/mirror/ym/thumbs -type f | sort | head -3 | xargs ls -l

      - name: 提交进本仓库（仅 commit 模式）
        if: inputs.mode == 'commit'
        run: |
          set -euo pipefail
          mkdir -p ym
          cp -R /tmp/mirror/ym/. ym/
          git add ym

          # 硬守卫：本仓库已有文件（README.md / images/ / thumbs/ / *.html）一律不许进暂存区
          STRAY="$(git diff --cached --name-only | grep -v '^ym/' || true)"
          if [ -n "$STRAY" ]; then
            echo "::error::暂存区出现 ym/ 之外的路径，已中止（未提交、未推送）："
            printf '%s\n' "$STRAY"
            exit 1
          fi
          echo "守卫通过：暂存区只有 ym/，共 $(git diff --cached --name-only | wc -l | tr -d ' ') 个文件"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "feat: 源 #2（YouMind）效果图镜像（$(find ym/images -type f | wc -l | tr -d ' ') 张 + 缩略图）"
            git push
          fi
